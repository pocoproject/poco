name: Validate nightly host lock
on:
  push:
    branches: [5649-full-nightly-linux]
permissions:
  contents: read
jobs:
  verify:
    runs-on: [poco-nightly]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: ci/nightly
      - run: python3 ci/nightly/job-lock.py verify
      - run: python3 ci/nightly/test_job_lock.py
