#
# MemoryDBBrowser.properties
#
# Picked up by ServerApplication::loadConfiguration() from the executable's
# directory. Every key here has a command-line equivalent, which wins:
#
#   MemoryDBBrowser --db=/var/lib/myapp/db --port=9880
#   MemoryDBBrowser /var/lib/myapp/db
#
# On Windows the option prefix is / rather than -- (Poco::Util::Application
# turns off UNIX-style options on non-UNIX platforms):
#
#   MemoryDBBrowser.exe /db=C:\var\myapp\db /port=9880
#

# Persistence directory of the MemoryDB to browse. Created if missing.
# Leave empty to require it on the command line.
memorydb.directory =

# This process OPENS the directory for writing, so nothing else may have it open.
# A MemoryDB's data lives in its owner's memory; a second process would see only
# flushed shard files, and holding one open blocks the owner's atomic rename and
# defers its flushes. An inspector belongs to whoever owns the store.
#
# false (the default) restricts the SQL console to statements that parse as
# SELECT - classification uses the same SQL parser MemoryDB uses to decide what
# counts as a write, and anything it cannot parse is treated as a write. Set true
# (or pass /allow-writes) to get a full console.
memorydb.allowWrites = false

memorydb.http.bind = 127.0.0.1
memorydb.http.port = 9880

# Directory holding index.html and friends. Empty means <exe dir>/webui, which
# is what a deployment copies next to the binary. Files are read per request, so
# editing the UI on the target box takes effect on reload.
memorydb.webroot =

# Result rows sent to the browser for one query. The full result set is still
# counted, so the UI can say "showing first N of M".
memorydb.query.maxRows = 500

# false (the default) keeps only the active shard in RAM; sealed shards stay on
# disk and are read on demand once attached. Set true only when the whole
# dataset comfortably fits in memory.
memorydb.loadArchivedShards = false

# Flush after this many seconds without a write.
memorydb.idleIntervalSeconds = 30

# Seal the active shard once its file reaches this size (bytes). 0 disables.
memorydb.shardMaxBytes = 268435456

logging.loggers.root.channel = console
logging.loggers.root.level = information
logging.channels.console.class = ConsoleChannel
logging.channels.console.pattern = %Y-%m-%d %H:%M:%S [%p] %s: %t
